<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f6f43"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-192.png"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes">
<title>Cantina da Tia Michelle e Tio Ricardo</title>
<style>
:root{--bg:#f6f4ef;--card:#fff;--tx:#1d1d1b;--mut:#66665f;--pri:#1f6f43;--prit:#fff;--neg:#b3261e;--pos:#1f6f43;--bd:#d6d2c6;--soft:#eaf3ed;--warn:#fff3cd;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#161714;--card:#22241f;--tx:#f1efe8;--mut:#a9a79d;--pri:#4fb77f;--prit:#0d1a12;--neg:#ff8a80;--pos:#6fd39b;--bd:#3a3c35;--soft:#25322b;--warn:#4a3f12;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#161714;--card:#22241f;--tx:#f1efe8;--mut:#a9a79d;--pri:#4fb77f;--prit:#0d1a12;--neg:#ff8a80;--pos:#6fd39b;--bd:#3a3c35;--soft:#25322b;--warn:#4a3f12;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:20px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
#app{max-width:1000px;margin:0 auto;padding:12px 12px 100px}
button,input{font:inherit;color:inherit}
button{cursor:pointer;min-height:56px;border:2px solid var(--bd);background:var(--card);border-radius:14px;padding:8px 14px;font-weight:600}
button.p{background:var(--pri);color:var(--prit);border-color:var(--pri)}
button.d{color:var(--neg);border-color:var(--neg)}
button:disabled{opacity:.45;cursor:not-allowed}
input{width:100%;min-height:56px;border:2px solid var(--bd);border-radius:12px;padding:8px 14px;background:var(--card)}
select{width:100%;min-height:56px;border:2px solid var(--bd);border-radius:12px;padding:8px 14px;background:var(--card);font:inherit;color:inherit}
label{display:block;font-weight:600;margin:12px 0 4px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}.chips button{min-height:48px;padding:4px 12px;font-size:17px}.chips button.on{background:var(--pri);color:var(--prit);border-color:var(--pri)}
.gt{margin:14px 0 6px;font-weight:800;font-size:21px;border-bottom:2px solid var(--bd);padding-bottom:2px}
.tabs{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-bottom:14px}
.tabs button{min-height:58px;padding:4px 2px;font-size:16px}
.tabs button.on{background:var(--pri);color:var(--prit);border-color:var(--pri)}
h2{margin:6px 0 10px;font-size:24px}
.card{background:var(--card);border:2px solid var(--bd);border-radius:16px;padding:14px;margin-bottom:10px}
.row{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.mut{color:var(--mut);font-size:17px}
.pos{color:var(--pos);font-weight:700}.neg{color:var(--neg);font-weight:700}
.big{font-size:32px;font-weight:800}
.al{width:100%;text-align:left;display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:8px;padding:12px 16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:8px}
.it{display:flex;gap:8px;align-items:stretch}
.it .ck{flex:1;display:flex;align-items:center;gap:12px;text-align:left}
.it.on .ck{background:var(--soft);border-color:var(--pri)}
.bx{width:34px;height:34px;border:3px solid var(--bd);border-radius:8px;display:inline-flex;align-items:center;justify-content:center;font-size:24px;color:var(--prit);flex:none}
.it.on .bx{background:var(--pri);border-color:var(--pri)}
.nm{flex:1}.pr{white-space:nowrap}
.st{display:flex;align-items:center;gap:6px}.st button{width:56px;padding:0;font-size:28px}.st b{min-width:30px;text-align:center;font-size:24px}
.bar{position:sticky;bottom:0;background:var(--card);border:2px solid var(--pri);border-radius:16px;padding:12px;margin-top:12px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.55);overflow:auto;padding:16px;z-index:20}
.md{background:var(--bg);max-width:560px;margin:0 auto;border-radius:18px;padding:16px;border:2px solid var(--bd)}
.acts{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}.acts button{flex:1}
.toast{position:fixed;left:12px;right:12px;bottom:calc(14px + env(safe-area-inset-bottom,0px));max-width:620px;margin:0 auto;background:var(--pri);color:var(--prit);padding:16px;border-radius:14px;font-weight:700;text-align:center;z-index:40}
.toast.err{background:var(--neg);color:#fff}
.warn{background:var(--warn);border:2px solid #d9a400;border-radius:12px;padding:10px;margin-top:10px;font-weight:600}
a{color:var(--pri);font-weight:700}
.mov{display:flex;justify-content:space-between;gap:8px;padding:8px 0;border-top:1px solid var(--bd);font-size:17px}
.tag{font-size:14px;border:1px solid var(--bd);border-radius:8px;padding:1px 6px;margin-left:6px;color:var(--mut)}
.cx{text-decoration:line-through;opacity:.6}
.hb{display:grid;grid-template-columns:minmax(90px,30%) 1fr auto;gap:8px;align-items:center;margin:6px 0;font-size:17px}
.tr{background:var(--soft);border-radius:8px;height:22px;overflow:hidden}.tr i{display:block;height:100%;background:var(--pri)}
.nav{display:grid;grid-template-columns:1fr 2fr 1fr;gap:8px;margin-bottom:12px}
svg text{fill:var(--tx);font-family:inherit}
.lg{width:58px;height:58px;border-radius:50%;flex:none}.lgb{width:170px;height:170px;display:block;margin:0 auto 6px}
</style><script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script><script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script><script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script></head><body>
<div id="app">Carregando…</div><div id="tst"></div>
<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const brl=n=>Number(n||0).toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const r2=x=>Math.round(x*100)/100;
function ymd(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function hoje(){return ymd(new Date())}
function addDays(s,n){const d=new Date(s+"T12:00:00");d.setDate(d.getDate()+n);return ymd(d)}
const WD=["dom","seg","ter","qua","qui","sex","sáb"];
const wd=s=>WD[new Date(s+"T12:00:00").getDay()],fd=s=>s.slice(8)+"/"+s.slice(5,7);

const fdt=iso=>new Date(iso).toLocaleDateString("pt-BR",{day:"2-digit",month:"2-digit",year:"numeric"});
function num(v){let s=String(v||"").trim().replace(/\s|R\$/g,"");if(s.includes(","))s=s.replace(/\./g,"").replace(",",".");const n=parseFloat(s);return isFinite(n)?r2(n):NaN}
const sc=v=>v<0?"neg":"pos";
const DEV=(()=>{try{let d=localStorage.getItem("dev");if(!d){d=uid();localStorage.setItem("dev",d)}return d}catch(e){return "x"+uid()}})();
const TURMAS=["Maternal","Infantil 1","Infantil 2","Pré","1º Fund.","2º Fund.","3º Fund.","4º Fund.","5º Fund.","6º Fund.","7º Fund.","8º Fund.","9º Fund.","1º Médio","2º Médio","3º Médio","Funcionários"];let qi="",pdfIrm=true;let fT="";const CATS=[["doce","Doces"],["salgado","Salgados"],["bebida","Bebidas"],["adicional","Adicionais"],["especial","Especiais"],["fruta","Frutas"]];const catOf=n=>{const m=Object.values(MN).find(x=>x.nome===n);return(m&&m.cat)||""};const grupos=ms=>CATS.concat([["","Sem categoria"]]).map(([k,t])=>[t,ms.filter(m=>(m.cat||"")===k)]).filter(g=>g[1].length);const tIdx=t=>{const i=TURMAS.indexOf(t);return i<0?99:i};const isF=a=>a.turma==="Funcionários";const membros=a=>a.fam?Object.values(AL).filter(x=>x.fam===a.fam):[a];const saldoF=a=>{const m=membros(a);return r2((m.length?m:[a]).reduce((t,x)=>t+x.saldo,0))};const temIrm=a=>!!a.fam&&membros(a).length>1;const detIrm=a=>membros(a).map(x=>esc(x.nome.split(" ")[0])+" "+brl(x.saldo)).join(" · ");const totalAberto=()=>{const vistos=new Set();let t=0;Object.values(AL).filter(a=>a.ativo).forEach(a=>{if(a.fam){if(vistos.has(a.fam))return;vistos.add(a.fam)}const v=saldoF(a);if(v<0)t+=v});return r2(t)};const norm=s=>String(s||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase();const sibs=a=>a.fam?Object.values(AL).filter(x=>x.id!==a.id&&x.fam===a.fam&&x.ativo):[];
function listaIrm(a){const t=norm(qi).trim();if(!t)return '<div class="mut">Digite a primeira letra do nome do irmão para aparecer a lista.</div>';const l=Object.values(AL).filter(x=>x.id!==a.id&&x.ativo&&!isF(x)&&!(a.fam&&x.fam===a.fam)).filter(x=>norm(x.nome).includes(t)).sort((u,v)=>(norm(v.nome).startsWith(t)-norm(u.nome).startsWith(t))||u.nome.localeCompare(v.nome,"pt-BR")).slice(0,10);return l.length?l.map(x=>`<button class="al" data-a="addIrm" data-id="${x.id}"><span><b>${esc(x.nome)}</b><br><span class="mut">${esc(x.turma||"")}${x.fam?" · já tem irmãos ligados":""}</span></span><span>+ Adicionar</span></button>`).join(""):'<div class="mut">Nenhum aluno encontrado.</div>'}
function chips(){const c={};Object.values(AL).forEach(a=>{if(a.ativo)c[a.turma]=(c[a.turma]||0)+1});return `<div class="chips"><button class="${!fT?"on":""}" data-a="fturma" data-id="">Todas</button>${TURMAS.map((t,i)=>`<button class="${fT===t?"on":""}" data-a="fturma" data-id="${i}">${esc(t)}${c[t]?" ("+c[t]+")":""}</button>`).join("")}</div>`}
let AL={},MN={},DI={},F={},db=null,ready=false,rd={},tab="lancar",sel=null,cart={},q="",modal=null,pend=null,busy=false,toast=null,tT=null,showIn=false,dia=hoje(),eL=[];

/* ---------- dados ---------- */
function rdAl(s){const x=s.data();let m=[];try{m=JSON.parse(x.m||"[]")}catch(e){}return{...x,id:s.id,movs:m,saldo:Number(x.saldo)||0,ativo:x.ativo!==false}}
function wrAl(a){return{nome:a.nome,turma:a.turma||"",p1:a.p1||"",t1:a.t1||"",p2:a.p2||"",t2:a.t2||"",saldo:r2(a.saldo),ativo:a.ativo!==false,fam:a.fam||"",m:JSON.stringify((a.movs||[]).slice(0,150))}}
function pd(s){let l=[];try{l=JSON.parse(s.data().l||"[]")}catch(e){}return{id:s.id,dia:s.data().dia,l}}
function addMov(a,m){a.movs=a.movs||[];a.movs.unshift(m);a.movs=a.movs.slice(0,150)}
let nPend=0,persOff=false;
function paintNet(){const n=$("net");if(!n)return;const off=!navigator.onLine;
 n.innerHTML=off?`<div class="warn" style="margin:0 0 10px">📴 Sem internet. Pode continuar trabalhando: tudo fica salvo no aparelho${nPend?` (${nPend} alteração(ões) aguardando envio)`:""} e vai para a nuvem quando a internet voltar.${persOff?" Atenção: este navegador não guarda dados offline, não feche o aplicativo.":""}</div>`:nPend?`<div class="warn" style="margin:0 0 10px">⏳ Enviando ${nPend} alteração(ões) para a nuvem…</div>`:""}
function esperar(p){nPend++;paintNet();const fim=()=>{nPend=Math.max(0,nPend-1);paintNet()};p.then(fim,e=>{fim();say("⚠ A nuvem recusou uma alteração. Confira o Movimento.",1)});
 if(!navigator.onLine)return Promise.resolve();return Promise.race([p,new Promise(r=>setTimeout(r,3000))])}
async function lerDoc(r){if(navigator.onLine){try{return await Promise.race([r.get(),new Promise((_,j)=>setTimeout(()=>j(new Error("lento")),3000))])}catch(e){}}return await r.get({source:"cache"})}
async function mutAluno(id,fn){const r=db.doc("alunos/"+id);let a;
 try{const s=await lerDoc(r);if(!s.exists)throw new Error("aluno");a=rdAl(s)}catch(e){if(AL[id])a=JSON.parse(JSON.stringify(AL[id]));else throw e}
 const s0=a.saldo;fn(a);const w=wrAl(a);w.saldo=firebase.firestore.FieldValue.increment(r2(a.saldo-s0));
 await esperar(r.update(w));AL[id]=a}
async function mutDia(docId,d,fn){const r=db.doc("dias/"+docId);let l=[];
 try{const s=await lerDoc(r);if(s.exists)l=JSON.parse(s.data().l||"[]")}catch(e){l=(DI[docId]&&DI[docId].l)?JSON.parse(JSON.stringify(DI[docId].l)):[]}
 fn(l);await esperar(r.set({dia:d,dev:DEV,l:JSON.stringify(l)}));DI[docId]={id:docId,dia:d,l}}
async function addL(x){const d=ymd(new Date(x.d));await mutDia(d+"_"+DEV,d,l=>l.push(x))}
const allL=()=>{const m=new Map();for(const k in DI)for(const x of DI[k].l){const e={...x,docId:k,dia:DI[k].dia};const o=m.get(x.id);if(!o||(e.dataAlterada&&!o.dataAlterada))m.set(x.id,e)}return[...m.values()]};
const lancDia=(d,A)=>(A||allL()).filter(x=>x.dia===d).sort((a,b)=>b.d.localeCompare(a.d));
const vend=l=>l.filter(x=>x.tipo==="venda"&&!x.cancelada);
const findL=id=>allL().find(x=>x.id===id);
const efeito=x=>x.tipo==="venda"?-x.valor:x.valor;
const resumo=it=>it.map(i=>i.qtd+"× "+i.nome).join(", ");
const tot=it=>r2(it.reduce((s,i)=>s+i.qtd*i.preco,0));
const sum=(l,f)=>r2(l.reduce((s,x)=>s+f(x),0));
const wk=d=>[-6,-5,-4,-3,-2,-1,0].map(n=>addDays(d,n));
async function ensure(ds){const from=addDays(hoje(),-13);const miss=ds.filter(d=>d<from&&!F[d]);await Promise.all(miss.map(async d=>{try{const s=await db.collection("dias").where("dia","==",d).get();s.docs.forEach(x=>DI[x.id]=pd(x));F[d]=1}catch(e){}}));if(miss.length)render()}
function cartItens(){return Object.keys(MN).filter(id=>cart[id]&&MN[id].ativo!==false).sort((a,b)=>MN[a].nome.localeCompare(MN[b].nome,"pt-BR")).map(id=>({nome:MN[id].nome,qtd:cart[id],preco:MN[id].preco,cat:MN[id].cat||""}))}
async function run(fn,ok){if(busy)return;busy=true;paintToast();let good=false;try{await fn();good=true}catch(e){console.error(e)}busy=false;if(good){render();say(ok||"✓ Salvo")}else say("⚠ NÃO foi possível salvar. Confira a internet e tente de novo. Antes de repetir, olhe a aba “Movimento” para não lançar duas vezes.",1)}
function paintToast(){const t=$("tst");if(!t)return;t.innerHTML=toast?`<div class="toast ${toast.err?"err":""}">${esc(toast.m)}</div>`:busy?'<div class="toast">Salvando… aguarde</div>':""}
function say(m,err){toast={m,err};clearTimeout(tT);tT=setTimeout(()=>{toast=null;paintToast()},err?8000:3000);paintToast()}
function ask(msg,fn){pend=fn;modal={t:"ask",msg};render()}
const dupAl=(n,t,self)=>Object.values(AL).some(a=>a.id!==self&&a.nome.trim().toLowerCase()===n.toLowerCase()&&(a.turma||"").trim().toLowerCase()===t.toLowerCase());
const fone=s=>String(s||"").replace(/\D/g,"");

/* ---------- telas ---------- */
function lista(){
  const t=q.trim().toLowerCase();const lancar=tab==="lancar";
  const l=Object.values(AL).filter(a=>(a.ativo||(!lancar&&showIn))&&(!t||a.nome.toLowerCase().includes(t)||(a.turma||"").toLowerCase().includes(t))&&(!fT||a.turma===fT)).sort((a,b)=>tIdx(a.turma)-tIdx(b.turma)||a.nome.localeCompare(b.nome,"pt-BR"));
  if(!Object.keys(AL).length)return '<div class="card mut">Nenhum aluno cadastrado ainda. Vá em “Alunos” e toque em “+ Novo aluno”.</div>';
  if(!l.length)return '<div class="card mut">Nenhum aluno encontrado.</div>';
  let last;return l.map(a=>(!fT&&a.turma!==last?(last=a.turma,`<div class="gt">${esc(a.turma||"Sem turma")}</div>`):"")+`<button class="al" data-a="${lancar?"pick":"perfil"}" data-id="${a.id}"><span><b>${esc(a.nome)}</b>${a.ativo?"":'<span class="tag">desativado</span>'}<br><span class="mut">${esc(a.turma||"")}${!lancar&&a.p1?" · "+esc(a.p1):""}</span></span><span class="${sc(saldoF(a))}">${brl(saldoF(a))}${temIrm(a)?'<br><span class="mut" style="font-weight:400">conjunto</span>':""}</span></button>`).join("");
}
function vLancar(){
  if(!sel||!AL[sel])return `<h2>Quem vai comprar?</h2>${chips()}<input id="q" placeholder="Digite o nome do aluno" value="${esc(q)}" autocomplete="off"><div id="lst" style="margin-top:10px">${lista()}</div>`;
  const a=AL[sel];const it=cartItens();const total=tot(it),n=it.reduce((s,i)=>s+i.qtd,0);
  const ms=Object.values(MN).filter(m=>m.ativo!==false).sort((x,y)=>x.nome.localeCompare(y.nome,"pt-BR"));
  const card=m=>{const k=cart[m.id]||0;return `<div class="it ${k?"on":""}"><button class="ck" data-a="add" data-id="${m.id}"><span class="bx">${k?"✓":""}</span><span class="nm">${esc(m.nome)}</span><span class="pr">${brl(m.preco)}</span></button>${k?`<div class="st"><button data-a="sub" data-id="${m.id}">−</button><b>${k}</b><button data-a="add" data-id="${m.id}">+</button></div>`:""}</div>`};const itens=grupos(ms).map(([t,l])=>`<div class="gt">${t}</div><div class="grid">${l.map(card).join("")}</div>`).join("");
  return `<div class="card"><div class="row"><div><b style="font-size:24px">${esc(a.nome)}</b><div class="mut">${esc(a.turma||"")}</div></div><div style="text-align:right"><div class="mut">${temIrm(a)?"Saldo conjunto (irmãos)":"Saldo"}</div><div class="big ${sc(saldoF(a))}">${brl(saldoF(a))}</div>${temIrm(a)?`<div class="mut">${detIrm(a)}</div>`:""}</div></div>
  <div class="acts"><button data-a="troca">Trocar aluno</button><button data-a="dep" data-id="${a.id}">Receber depósito</button></div></div>
  <h2>Marque o que o aluno consumiu</h2>${itens||'<div class="card mut">O cardápio está vazio. Vá em “Cardápio” para cadastrar os itens.</div>'}
  <div class="bar"><div><div class="mut">${n} item(ns)</div><div class="big">${brl(total)}</div></div><div class="acts" style="margin:0"><button data-a="limpar">Limpar</button><button class="p" data-a="confirmar" ${n?"":"disabled"}>Conferir e confirmar</button></div></div>`;
}
function vAlunos(){
  const dev=totalAberto();
  return `<div class="row"><h2>Alunos e funcionários</h2><button class="p" data-a="novoAluno">+ Novo aluno</button></div>
  <div class="mut" style="margin-bottom:8px">Total em aberto (saldos negativos): <span class="neg">${brl(dev)}</span></div>
  ${chips()}<input id="q" placeholder="Buscar por nome ou turma" value="${esc(q)}" autocomplete="off"><div id="lst" style="margin-top:10px">${lista()}</div>
  <div class="acts"><button data-a="verIn">${showIn?"Esconder":"Mostrar"} alunos desativados</button></div>`;
}
function vCardapio(){
  const ms=Object.values(MN).sort((a,b)=>(b.ativo!==false)-(a.ativo!==false)||a.nome.localeCompare(b.nome,"pt-BR"));
  return `<div class="row"><h2>Cardápio</h2><button class="p" data-a="novoItem">+ Novo item</button></div>`+
  (ms.length?grupos(ms).map(([t,l])=>`<div class="gt">${t}</div>`+l.map(m=>`<div class="card row ${m.ativo===false?"cx":""}"><div><b>${esc(m.nome)}</b>${m.ativo===false?'<span class="tag">oculto</span>':""}<div>${brl(m.preco)}</div></div><div class="acts" style="margin:0"><button data-a="editItem" data-id="${m.id}">Editar</button><button data-a="togItem" data-id="${m.id}">${m.ativo===false?"Mostrar":"Ocultar"}</button><button class="d" data-a="delItem" data-id="${m.id}">Apagar</button></div></div>`).join("")).join(""):'<div class="card mut">Nenhum item ainda. Toque em “+ Novo item”.</div>')+
  '<div class="mut">Itens ocultos somem da tela de lançamento, mas as vendas antigas continuam registradas.</div>';
}
function navDia(){return `<div class="nav"><button data-a="dprev">◀ Anterior</button><input type="date" id="dia" value="${dia}" max="${hoje()}"><button data-a="dnext" ${dia>=hoje()?"disabled":""}>Seguinte ▶</button></div>`}
function vMov(){
  const L=lancDia(dia);const V=vend(L);

function vResumo(){
  const A=allL(),L=lancDia(dia,A),V=vend(L);const total=sum(V,x=>x.valor);const dep=sum(L.filter(x=>x.tipo==="deposito"&&!x.cancelada),x=>x.valor);
  const por={};V.forEach(v=>v.itens.forEach(i=>{const o=por[i.nome]||(por[i.nome]={q:0,v:0});o.q+=i.qtd;o.v+=i.qtd*i.preco}));
  const rank=o=>Object.entries(o).sort((a,b)=>b[1].v-a[1].v);
  const bars=o=>{const r=rank(o);const mx=Math.max(...r.map(e=>e[1].v),1);return r.map(([n,e])=>`<div class="hb"><span>${esc(n)}</span><div class="tr"><i style="width:${Math.round(e.v/mx*100)}%"></i></div><b>${e.q}× · ${brl(e.v)}</b></div>`).join("")||'<div class="mut">Sem vendas.</div>'};
  const ds=wk(dia);const tt=ds.map(d=>sum(vend(lancDia(d,A)),x=>x.valor));const mx=Math.max(...tt,1);
  const pw={};ds.forEach(d=>vend(lancDia(d,A)).forEach(v=>v.itens.forEach(i=>{const o=pw[i.nome]||(pw[i.nome]={q:0,v:0});o.q+=i.qtd;o.v+=i.qtd*i.preco})));

  <div class="card"><b>Dia ${fd(dia)}</b><div class="big">${brl(total)}</div><div class="mut">${V.length} venda(s) · ticket médio ${brl(V.length?total/V.length:0)} · depósitos recebidos ${brl(dep)}</div><div style="margin-top:10px"><b>Por item</b>${bars(por)}</div></div>
  <div class="card"><b>Semana (7 dias até ${fd(dia)})</b><div class="big">${brl(sum(tt.map(v=>({v})),x=>x.v))}</div>${svg}<div class="mut">Valores em reais vendidos por dia.</div><div style="margin-top:10px"><b>Itens mais vendidos na semana</b>${bars(pw)}</div></div>

}

 const go=async()=>{const e=$("em").value.trim(),p=$("sn").value;if(!e||!p){telaLogin("Digite o e-mail e a senha.",e);return}
  $("ent").disabled=true;$("ent").textContent="Entrando…";
  try{await firebase.auth().signInWithEmailAndPassword(e,p)}catch(x){const c=(x&&x.code)||"";telaLogin(c==="auth/network-request-failed"?"Sem internet. Confira a conexão.":c==="auth/too-many-requests"?"Muitas tentativas. Espere alguns minutos e tente de novo.":"E-mail ou senha incorretos.",e)}};
 $("ver").onclick=()=>{const i=$("sn"),m=i.type==="password";i.type=m?"text":"password";$("ver").textContent=m?"Ocultar senha":"Mostrar senha"};$("ent").onclick=go;$("sn").onkeydown=ev=>{if(ev.key==="Enter")go()};$("em").onkeydown=ev=>{if(ev.key==="Enter")$("sn").focus()}}

 const er=()=>{if(usuario)say("⚠ Conexão com os dados falhou. Confira a internet.",1)};

 }catch(e){console.error(e);db=null}
